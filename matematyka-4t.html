<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Matematyka 4T</title>
<meta name="description" content="Materiały do matematyki dla klasy 4T.">
<style>
  :root{
    --bg:#f7f8fa; --card:#ffffff; --text:#1d2330; --muted:#5b6475; --line:#dde1e8;
    --accent:#2563eb; --accent-soft:#e8efff; --ok:#15803d; --ok-soft:#e7f6ec; --warn:#b45309; --warn-soft:#fdf3e3;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12151b; --card:#1b1f27; --text:#e6e9ef; --muted:#9aa3b2; --line:#2c323d;
      --accent:#7aa2ff; --accent-soft:#1e2a44; --ok:#4ade80; --ok-soft:#163323; --warn:#fbbf24; --warn-soft:#3a2d12;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:17px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{background:var(--accent);color:#fff;padding:2.2rem 1rem}
  header .wrap,main,footer{max-width:920px;margin:auto}
  header p{margin:.2rem 0;opacity:.92}
  header h1{margin:.3rem 0;font-size:2.1rem;line-height:1.2}
  main{padding:1rem}
  h2{font-size:1.3rem;margin:1.6rem 0 .6rem}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.8rem}
  a.card{display:flex;gap:.8rem;align-items:flex-start;background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:.9rem 1rem;text-decoration:none;color:var(--text);transition:border-color .15s,transform .15s}
  a.card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .num{flex:none;width:2rem;height:2rem;border-radius:50%;background:var(--accent-soft);color:var(--accent);
    display:flex;align-items:center;justify-content:center;font-weight:700}
  .card strong{display:block;line-height:1.3}
  .card span.d{display:block;color:var(--muted);font-size:.9rem;margin-top:.2rem;line-height:1.4}
  .tag{display:inline-block;font-size:.75rem;font-weight:700;padding:.05rem .5rem;border-radius:99px;
    background:var(--ok-soft);color:var(--ok);margin-top:.35rem}
  .exam a.card .num{background:var(--warn-soft);color:var(--warn)}
  .intro{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:1rem 1.2rem;margin-top:1rem}
  .intro p{margin:.3rem 0}
  footer{padding:1.5rem 1rem;color:var(--muted);font-size:.9rem;text-align:center}
</style>
</head>
<body>

<header><div class="wrap">
  <p><a href="index.html" style="color:#fff">← Matematyka</a></p>
  <h1>Matematyka 4T</h1>
  <p>Tematy lekcji i materiały przed pracami klasowymi.</p>
</div></header>

<main>
  <div class="intro">
    <p><strong>Materiały w przygotowaniu.</strong> Tematy pojawią się tutaj w miarę realizacji programu.</p>
  </div>

  <h2>Tematy lekcji</h2>
  <div class="cards">
    <!-- Tu dodawaj kafelki tematów, np.:
    <a class="card" href="..."><span class="num">1</span><span><strong>Temat</strong><span class="d">Krótki opis.</span></span></a>
    -->
  </div>
</main>

<footer>Matematyka 4T · materiały dla uczniów</footer>
</body>
</html>
